[package]
name = "peer-payments"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://git.iris.to/#/npub1xdhnr9mrv47kkrn95k6cwecearydeh8e895990n3acntwvmgk2dsdeeycm/cashu-service"
description = "Durable, bounded peer credit shared by paid services without a mint"

[features]
social-graph = ["dep:nostr-social-graph"]

[dependencies]
nostr-social-graph = { version = "=0.2.0", optional = true }
cashu-credit = { path = "../cashu-credit", version = "0.3.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
fs2 = "0.4"
sha2 = "0.10"
secp256k1 = { version = "0.29", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
