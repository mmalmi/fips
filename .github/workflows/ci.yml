name: Library package qualification
on:
  push:
    branches: [codex/qualification-fips106]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: fips-library-qualification-1.95.0-20261018-${{ github.run_id }}
          restore-keys: fips-library-qualification-1.95.0-20261018-
      - run: python3 .qualification/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-qualification
          path: |
            .qualification/result.json
            .qualification/command-*.log
          include-hidden-files: true
          retention-days: 7
