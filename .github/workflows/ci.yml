name: Transition delivery diagnostics
on:
  push:
    branches: [codex/fips-transition-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  staggered:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REKEY_TOPOLOGY: rekey-outbound-only
      REKEY_SCENARIO: staggered-overlap
      REKEY_OUTBOUND_ONLY_NODES: b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fips-linux
          path: _bin
          run-id: 33992029606
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact 73236cc2 binaries and diagnostic logging
        run: |
          chmod +x _bin/*
          cp _bin/fips _bin/fipsctl testing/docker/
          docker build -t fips-test:latest testing/docker
          sed -i 's/fips_core::node::handlers::handshake=debug/fips_core::node::handlers::handshake=debug,fips_core::dataplane=debug/g' testing/static/docker-compose.yml
          bash testing/static/scripts/generate-configs.sh "$REKEY_TOPOLOGY"
          bash testing/static/scripts/rekey-test.sh inject-config
          docker compose -f testing/static/docker-compose.yml --profile "$REKEY_TOPOLOGY" up -d
      - name: Check continuous delivery and two key rotations
        run: bash testing/static/scripts/rekey-test.sh
      - name: Collect diagnostics
        if: always()
        run: bash testing/static/scripts/rekey-test.sh collect-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-delivery-73236cc2
          path: testing/static/artifacts/rekey-rekey-outbound-only-staggered-overlap
          retention-days: 7
      - name: Stop owned test containers
        if: always()
        run: docker compose -f testing/static/docker-compose.yml --profile "$REKEY_TOPOLOGY" down --volumes --remove-orphans
