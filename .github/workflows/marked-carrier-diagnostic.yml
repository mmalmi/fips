name: FIPS 0.4.109 package qualification

on:
  push:
    branches: [codex/marked-carrier-trace]

permissions:
  contents: read

concurrency:
  group: marked-carrier-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PRODUCTION_SOURCE_SHA: 824ed235d8422f99c51d898affb1931a83fb98ca
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Preserve harness and select exact source
        run: |
          cp scripts/run-fips-package-ci.py "$RUNNER_TEMP/run-fips-package-ci.py"
          git checkout --detach "$PRODUCTION_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCTION_SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: fips-marked-carrier-1.95.0-debug0-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: fips-marked-carrier-1.95.0-debug0-e514e1028713089eb883dc41fc70852acb1965bd7778dabaa5dbc268d03c4780-40205177265
      - name: Package and verify both default libraries
        run: python3 "$RUNNER_TEMP/run-fips-package-ci.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fips-package-qualification-${{ github.run_id }}
          path: package-results/
          if-no-files-found: warn
          retention-days: 14
