name: FIPS 0.4.109 adapter qualification

on:
  push:
    branches: [codex/marked-carrier-trace]

permissions:
  contents: read

concurrency:
  group: marked-carrier-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ADAPTER_SOURCE_SHA: 1cf6d579352f64574c23de869220ba7e3ee9bbc7
      ADAPTER_BASE_SHA: 2816724498d2e14c19bd2c92a629f7eabccbbf51
      ADAPTER_WORKSPACE: rust
      ADAPTER_PACKAGE: nvpn-fips-tcp-endpoint
      ADAPTER_PACKAGE_PATH: rust/fips-tcp-endpoint
      ADAPTER_VERSION: 0.2.44
      ADAPTER_BASE_VERSION: 0.2.43
      ADAPTER_BASE_CHECKSUM: 033a3287387c86f27e2f98fb5fb191bddaedf5845de5307352a49c9b16fe4ebf
      ADAPTER_EXPECTED_TESTS: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mmalmi/fips-tcp
          ref: 1cf6d579352f64574c23de869220ba7e3ee9bbc7
          path: adapter
          fetch-depth: 2
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: fips-marked-carrier-1.95.0-debug0-${{ hashFiles('adapter/rust/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: fips-marked-carrier-1.95.0-debug0-e514e1028713089eb883dc41fc70852acb1965bd7778dabaa5dbc268d03c4780-40205937708
      - name: Test and verify the exact adapter package
        run: python3 scripts/run-fips-adapter-ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fips-adapter-qualification-${{ github.run_id }}
          path: adapter-results/
          if-no-files-found: warn
          retention-days: 14
