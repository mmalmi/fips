[package]
name = "fips-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental sender-funded native FIPS forwarding service"

[features]
testbench = ["cashu-service/simulation"]
measurements = ["dep:libc"]

[[bin]]
name = "fips-relay-test-mint"
path = "src/bin/fips-relay-test-mint.rs"
required-features = ["testbench"]

[dependencies]
fips-core = { package = "nvpn-fips-core", version = "=0.4.81", path = "../fips-core" }
cashu-service = { version = "=0.4.8", default-features = false, features = ["wallet", "spilman-wallet-http", "spilman-configurable-host-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = { version = "2", features = ["serde"] }
url = "2"
fs2 = "0.4"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
fips-tcp = { package = "nvpn-fips-tcp", version = "=0.2.2" }
fips-tcp-endpoint = { package = "nvpn-fips-tcp-endpoint", version = "=0.2.16" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cashu = { version = "=0.17.3", default-features = false }
libc = { version = "0.2", optional = true }

[dev-dependencies]
cashu-service = { version = "=0.4.8", default-features = false, features = ["simulation", "spilman-wallet-http", "spilman-configurable-host-reqwest"] }
tokio = { version = "1", features = ["process"] }
