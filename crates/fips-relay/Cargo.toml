[package]
workspace = "../../paid-routing"
name = "fips-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental sender-funded native FIPS forwarding service"

[features]
testbench = ["cashu-service/simulation"]
test-native-roots = ["dep:tokio-tungstenite"]
measurements = ["dep:libc"]

[[bin]]
name = "fips-relay-test-mint"
path = "src/bin/fips-relay-test-mint.rs"
required-features = ["testbench"]

[dependencies]
fips-credit = { version = "=0.1.0", path = "../fips-credit" }
nvpn-fips-core = { version = "=0.4.123", path = "../fips-core" }
# The wallet workspace pins the funding and refund APIs used by this adapter.
cashu-service = { version = "=0.4.8", default-features = false, features = ["wallet", "spilman-wallet-http", "spilman-configurable-host-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = { version = "2", features = ["serde"] }
url = "2"
fs2 = "0.4"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
nvpn-fips-tcp = { version = "=0.2.6" }
nvpn-fips-tcp-endpoint = { version = "=0.2.57" }
tokio-tungstenite = { version = "0.29.0", optional = true, default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cashu = { version = "=0.18.0", default-features = false }
libc = { version = "0.2", optional = true }

[dev-dependencies]
peer-payments = { version = "=0.1.0", path = "../../vendor/peer-payments" }
cdk-common = { version = "=0.18.0", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "=0.18.0", default-features = false, features = ["wallet"] }
nvpn-fips-core = { version = "=0.4.123", path = "../fips-core", features = ["sim-transport"] }
cashu-service = { version = "=0.4.8", default-features = false, features = ["simulation", "spilman-wallet-http", "spilman-configurable-host-reqwest"] }
rcgen = "0.13.2"
tokio = { version = "1", features = ["process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
